# Bouwt de site en zet hem op Cloudflare Pages. Start:
#  - automatisch na "Publiceren" in Sanity (webhook → repository_dispatch 'sanity-publish'),
#  - bij een push naar de branch in DEPLOY_REF,
#  - handmatig via Actions → Deploy → Run workflow.
# Opzet (secrets, variabelen, Sanity-webhook): zie docs/sanity.md.
name: Deploy

on:
  repository_dispatch:
    types: [sanity-publish]
  push:
    branches: [main, feature/sanity-cms]
  workflow_dispatch:

# Snel achter elkaar publiceren: alleen de nieuwste build afmaken (die bevat alles).
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bij een push alleen de branch uit DEPLOY_REF deployen; Sanity en handmatig altijd.
    if: github.event_name != 'push' || github.ref_name == (vars.DEPLOY_REF || 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          # repository_dispatch draait standaard op de default branch; bouw de ingestelde branch.
          ref: ${{ vars.DEPLOY_REF || github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET || 'production' }}
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT }}
          PUBLIC_ENABLE_TRACKING: ${{ vars.PUBLIC_ENABLE_TRACKING || 'false' }}

      - name: Deploy naar Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name bold-productions --branch "${{ vars.CF_PAGES_BRANCH || 'preview' }}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
